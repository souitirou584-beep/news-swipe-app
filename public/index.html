<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>10秒ニュース | スワイプで読む</title>
<meta name="description" content="上下左右スワイプ・キーボード操作でサクサク読めるニュースアプリ" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
<!-- 丸みのあるモダンフォント（M PLUS Rounded 1c）をインポート -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    /* 完全な黒ベースのカラーパレット */
    --bg: #000000;
    --card: #121212;
    --card-border: #262626;
    --card-inner: #181818;
    --accent: #ffffff;
    --accent-bg: #222222;
    --text-primary: #f5f5f5;
    --text-secondary: #d4d4d4;
    --text-muted: #737373;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text-primary);
    font-family: "Noto Sans JP", -apple-system, BlinkMacSystemFont, sans-serif;
  }

  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(14px + var(--safe-top)) 24px 12px;
    z-index: 50;
  }

  .app-name {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 0.03em;
  }
  .app-name span { color: var(--accent); }

  .indicator {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-secondary);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--card-border);
    padding: 6px 14px;
    border-radius: 999px;
  }

  /* Swipers */
  .swiper-vertical-main {
    flex: 1 1 auto;
    width: 100%;
    height: 100%;
  }

  .swiper-horizontal-sub {
    width: 100%;
    height: 100%;
  }

  .swiper-slide {
    display: flex;
    align-items: stretch;
    padding: 0 20px calc(16px + var(--safe-bottom));
  }

  .card {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 26px 24px calc(20px + var(--safe-bottom) * 0.3);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
  }

  .card-top {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .badges {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .badge {
    font-size: 13px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 999px;
  }

  .badge-category {
    background: rgba(56, 189, 248, 0.18);
    color: var(--accent);
    border: 1px solid rgba(56, 189, 248, 0.4);
  }

  .badge-page {
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    font-weight: 700;
  }

  .badge-date {
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 500;
    margin-left: auto;
  }

  /* タイトルフォント（丸みのあるフォント） */
  h1.headline {
    font-family: 'M PLUS Rounded 1c', "Noto Sans JP", sans-serif;
    font-size: 23px;
    line-height: 1.45;
    font-weight: 800;
    margin: 0;
    color: var(--text-primary);
    letter-spacing: 0.01em;
  }

  /* 本文表示枠 */
  .summary-box {
    background: rgba(11, 17, 32, 0.6);
    border-radius: 16px;
    padding: 20px;
    border: 1px solid rgba(255, 255, 255, 0.06);
  }

  .sentence-line {
    font-size: 18px;
    line-height: 1.85;
    color: var(--text-secondary);
    margin: 0 0 14px 0;
    word-break: break-word;
  }
  .sentence-line:last-child {
    margin-bottom: 0;
  }

  .card-bottom {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 18px;
  }

  .nav-hint {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    padding: 0 6px;
  }

  a.read-link {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 50px;
    background: #ffffff;
    color: #000000;
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-weight: 800;
    font-size: 15px;
    text-decoration: none;
    border-radius: 14px;
    transition: opacity 0.1s ease, transform 0.1s ease;
  }
  a.read-link:active { transform: scale(0.98); }

  /* States */
  .state-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px;
    text-align: center;
    z-index: 60;
  }

  .spinner {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 4px solid var(--card-border);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="app-name">10Sec<span>News</span></div>
    <div class="indicator" id="indicator">- / -</div>
  </header>

  <!-- 縦スワイプ（記事切り替え） -->
  <div class="swiper swiper-vertical-main" id="vertical-swiper">
    <div class="swiper-wrapper" id="vertical-wrapper"></div>
  </div>

  <div class="state-screen" id="loading-screen">
    <div class="spinner"></div>
    <div style="color: var(--text-secondary); font-size: 16px; font-weight: 600;">最新ニュースを取得中...</div>
  </div>

  <div class="state-screen hidden" id="error-screen">
    <div style="font-size: 36px;">⚠️</div>
    <div id="error-message" style="color: var(--text-secondary); font-size: 16px;">取得に失敗しました</div>
    <button onclick="loadNews()" style="padding: 10px 22px; border-radius: 12px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); font-weight: 700; font-size: 15px;">再試行</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
  const API_URL = "/api/news";

  // ==========================================
  // 【調整用パラメータ】
  // 1スライドあたりに収める目標文字数（初期値: 90文字）
  // ・文字量を増やしたい場合: 120〜150 などに上げる
  // ・文字量を減らしてテンポよく送りたい場合: 60〜70 などに下げる
  // ==========================================
  const TARGET_PAGE_LENGTH = 90;

  const loadingScreen = document.getElementById("loading-screen");
  const errorScreen = document.getElementById("error-screen");
  const errorMessage = document.getElementById("error-message");
  const verticalWrapper = document.getElementById("vertical-wrapper");
  const indicator = document.getElementById("indicator");

  let verticalSwiperInstance = null;
  let horizontalSwiperInstances = [];

  function paginateSentences(text, minTarget) {
    if (!text) return [["（詳細情報は元記事をご確認ください）"]];
    const clean = text.replace(/\s+/g, " ").trim();

    const rawSentences = clean.split(/(?<=。)/g).filter(s => s.trim().length > 0);
    if (rawSentences.length === 0) return [[clean]];

    const pages = [];
    let currentBatch = [];
    let currentLen = 0;

    for (const sentence of rawSentences) {
      currentBatch.push(sentence.trim());
      currentLen += sentence.length;

      if (currentLen >= minTarget) {
        pages.push(currentBatch);
        currentBatch = [];
        currentLen = 0;
      }
    }

    if (currentBatch.length > 0) {
      pages.push(currentBatch);
    }

    return pages;
  }

  function formatDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  }

  function escapeHtml(str) {
    return (str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function buildArticleSlide(article, articleIndex, totalArticles) {
    const pages = paginateSentences(article.description, TARGET_PAGE_LENGTH);
    const totalPages = pages.length;

    const subSlides = pages.map((sentenceArray, pageIndex) => {
      const sentencesHtml = sentenceArray
        .map(sent => `<p class="sentence-line">${escapeHtml(sent)}</p>`)
        .join("");

      return `
        <div class="swiper-slide">
          <div class="card">
            <div class="card-top">
              <div class="badges">
                <span class="badge badge-category">トピックス</span>
                <span class="badge badge-page">続き ${pageIndex + 1}/${totalPages}</span>
                <span class="badge-date">${escapeHtml(formatDate(article.pubDate))}</span>
              </div>
              <h1 class="headline">${escapeHtml(article.title)}</h1>
              <div class="summary-box">
                ${sentencesHtml}
              </div>
            </div>
            <div class="card-bottom">
              <div class="nav-hint">
                <span>${totalPages > 1 ? (pageIndex < totalPages - 1 ? "[→] 続きを見る" : "[←] 前へ戻る") : "1ページ完結"}</span>
                <span>[↓ / Space] 次の記事</span>
              </div>
              <a class="read-link" href="${escapeHtml(article.link)}" target="_blank" rel="noopener noreferrer">
                元記事を開く ↗
              </a>
            </div>
          </div>
        </div>
      `;
    }).join("");

    return `
      <div class="swiper-slide">
        <div class="swiper swiper-horizontal-sub">
          <div class="swiper-wrapper">
            ${subSlides}
          </div>
        </div>
      </div>
    `;
  }

  async function loadNews() {
    loadingScreen.classList.remove("hidden");
    errorScreen.classList.add("hidden");

    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error(`Status: ${res.status}`);
      const data = await res.json();
      const articles = data.articles || [];

      if (articles.length === 0) throw new Error("記事がありません");

      verticalWrapper.innerHTML = articles
        .map((a, i) => buildArticleSlide(a, i, articles.length))
        .join("");

      loadingScreen.classList.add("hidden");

      horizontalSwiperInstances = [];
      document.querySelectorAll(".swiper-horizontal-sub").forEach((el) => {
        const hSwiper = new Swiper(el, {
          direction: "horizontal",
          nested: true,
          threshold: 8,
          speed: 280,
        });
        horizontalSwiperInstances.push(hSwiper);
      });

      verticalSwiperInstance = new Swiper("#vertical-swiper", {
        direction: "vertical",
        threshold: 8,
        speed: 300,
        on: {
          slideChange(sw) {
            indicator.textContent = `${sw.activeIndex + 1} / ${articles.length}`;
          },
        },
      });

      indicator.textContent = `1 / ${articles.length}`;
    } catch (err) {
      loadingScreen.classList.add("hidden");
      errorScreen.classList.remove("hidden");
      errorMessage.textContent = err.message || "取得に失敗しました";
    }
  }

  // --- キーボード操作（矢印キー + スペースキー対応） ---
  window.addEventListener("keydown", (e) => {
    if (!verticalSwiperInstance) return;

    const currentVerticalIndex = verticalSwiperInstance.activeIndex;
    const currentHorizontalSwiper = horizontalSwiperInstances[currentVerticalIndex];

    switch (e.code) {
      case "ArrowDown":
      case "Space": // スペースキーまたは下矢印で次の記事へ
        verticalSwiperInstance.slideNext();
        e.preventDefault();
        break;
      case "ArrowUp": // 上矢印で前の記事へ
        verticalSwiperInstance.slidePrev();
        e.preventDefault();
        break;
      case "ArrowRight": // 右矢印で続き（次ページ）へ
        if (currentHorizontalSwiper) {
          currentHorizontalSwiper.slideNext();
        }
        e.preventDefault();
        break;
      case "ArrowLeft": // 左矢印で前のページへ
        if (currentHorizontalSwiper) {
          currentHorizontalSwiper.slidePrev();
        }
        e.preventDefault();
        break;
    }
  });

  loadNews();
</script>
</body>
</html>
