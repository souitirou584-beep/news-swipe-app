<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>10秒ニュース | スワイプで読む</title>
<meta name="description" content="上下左右スワイプで素早く読めるニュースアプリ" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-border: #29374d;
    --accent: #38bdf8;
    --text-primary: #f1f5f9;
    --text-secondary: #cbd5e1;
    --text-muted: #64748b;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }

  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(10px + var(--safe-top)) 20px 10px;
    z-index: 50;
  }

  .app-name {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .app-name span { color: var(--accent); }

  .indicator {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--card-border);
    padding: 4px 10px;
    border-radius: 999px;
  }

  /* Swipers */
  .swiper-vertical-main {
    flex: 1 1 auto;
    width: 100%;
    height: 100%;
  }

  .swiper-horizontal-sub {
    width: 100%;
    height: 100%;
  }

  .swiper-slide {
    display: flex;
    align-items: stretch;
    padding: 0 16px calc(12px + var(--safe-bottom));
  }

  .card {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 20px 20px calc(16px + var(--safe-bottom) * 0.3);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }

  .card-top {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .badges {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 999px;
  }

  .badge-category {
    background: rgba(56, 189, 248, 0.15);
    color: var(--accent);
    border: 1px solid rgba(56, 189, 248, 0.35);
  }

  .badge-page {
    background: rgba(255, 255, 255, 0.1);
    color: var(--text-secondary);
  }

  .badge-date {
    color: var(--text-muted);
    font-size: 11px;
    margin-left: auto;
  }

  h1.headline {
    font-size: 18px;
    line-height: 1.4;
    font-weight: 700;
    margin: 0;
    color: var(--text-primary);
  }

  .summary-box {
    background: rgba(15, 23, 42, 0.5);
    border-radius: 12px;
    padding: 16px;
    border: 1px solid rgba(255, 255, 255, 0.04);
  }

  /* 一文ずつの段落スタイル */
  .sentence-line {
    font-size: 15px;
    line-height: 1.75;
    color: var(--text-secondary);
    margin: 0 0 10px 0;
    word-break: break-word;
  }
  .sentence-line:last-child {
    margin-bottom: 0;
  }

  .card-bottom {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 14px;
  }

  .nav-hint {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-muted);
    padding: 0 4px;
  }

  a.read-link {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    background: var(--accent);
    color: #06202f;
    font-weight: 700;
    font-size: 14px;
    text-decoration: none;
    border-radius: 12px;
  }
  a.read-link:active { transform: scale(0.98); }

  /* States */
  .state-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    text-align: center;
    z-index: 60;
  }

  .spinner {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 3px solid var(--card-border);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="app-name">10Sec<span>News</span></div>
    <div class="indicator" id="indicator">- / -</div>
  </header>

  <!-- 縦スワイプ（記事切り替え） -->
  <div class="swiper swiper-vertical-main" id="vertical-swiper">
    <div class="swiper-wrapper" id="vertical-wrapper"></div>
  </div>

  <div class="state-screen" id="loading-screen">
    <div class="spinner"></div>
    <div style="color: var(--text-secondary); font-size: 14px;">最新ニュースを取得中...</div>
  </div>

  <div class="state-screen hidden" id="error-screen">
    <div style="font-size: 32px;">⚠️</div>
    <div id="error-message" style="color: var(--text-secondary); font-size: 14px;">取得に失敗しました</div>
    <button onclick="loadNews()" style="padding: 8px 18px; border-radius: 10px; border: 1px solid var(--accent); background: transparent; color: var(--accent);">再試行</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
  const API_URL = "/api/news";
  const TARGET_PAGE_LENGTH = 180; // 1ページあたりの目標文字数（文末単位でまとめる）

  const loadingScreen = document.getElementById("loading-screen");
  const errorScreen = document.getElementById("error-screen");
  const errorMessage = document.getElementById("error-message");
  const verticalWrapper = document.getElementById("vertical-wrapper");
  const indicator = document.getElementById("indicator");

  let verticalSwiperInstance = null;

  // 文末（。など）単位で区切り、適度な長さごとにページ分割する
  function paginateSentences(text, minTarget) {
    if (!text) return [[]];
    const clean = text.replace(/\s+/g, " ").trim();

    // 句点（。）で分割し、句点を末尾に戻す
    const rawSentences = clean.split(/(?<=。)/g).filter(s => s.trim().length > 0);
    if (rawSentences.length === 0) return [[clean]];

    const pages = [];
    let currentBatch = [];
    let currentLen = 0;

    for (const sentence of rawSentences) {
      currentBatch.push(sentence.trim());
      currentLen += sentence.length;

      // 目標文字数を超えたらページを区切る
      if (currentLen >= minTarget) {
        pages.push(currentBatch);
        currentBatch = [];
        currentLen = 0;
      }
    }

    if (currentBatch.length > 0) {
      pages.push(currentBatch);
    }

    return pages;
  }

  function formatDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  }

  function escapeHtml(str) {
    return (str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // 1つの記事（横スワイプ用のSwiperを含む縦スライド）を生成
  function buildArticleSlide(article, articleIndex, totalArticles) {
    const pages = paginateSentences(article.description, TARGET_PAGE_LENGTH);
    const totalPages = pages.length;

    const subSlides = pages.map((sentenceArray, pageIndex) => {
      const sentencesHtml = sentenceArray
        .map(sent => `<p class="sentence-line">${escapeHtml(sent)}</p>`)
        .join("");

      return `
        <div class="swiper-slide">
          <div class="card">
            <div class="card-top">
              <div class="badges">
                <span class="badge badge-category">主要ニュース</span>
                <span class="badge badge-page">続き ${pageIndex + 1}/${totalPages}</span>
                <span class="badge-date">${escapeHtml(formatDate(article.pubDate))}</span>
              </div>
              <h1 class="headline">${escapeHtml(article.title)}</h1>
              <div class="summary-box">
                ${sentencesHtml}
              </div>
            </div>
            <div class="card-bottom">
              <div class="nav-hint">
                <span>${totalPages > 1 ? (pageIndex < totalPages - 1 ? "👉 右で続きを読む" : "👈 左で戻る") : ""}</span>
                <span>👇 下で次のニュース</span>
              </div>
              <a class="read-link" href="${escapeHtml(article.link)}" target="_blank" rel="noopener noreferrer">
                元記事を開く ↗
              </a>
            </div>
          </div>
        </div>
      `;
    }).join("");

    return `
      <div class="swiper-slide">
        <div class="swiper swiper-horizontal-sub">
          <div class="swiper-wrapper">
            ${subSlides}
          </div>
        </div>
      </div>
    `;
  }

  async function loadNews() {
    loadingScreen.classList.remove("hidden");
    errorScreen.classList.add("hidden");

    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error(`Status: ${res.status}`);
      const data = await res.json();
      const articles = data.articles || [];

      if (articles.length === 0) throw new Error("記事がありません");

      verticalWrapper.innerHTML = articles
        .map((a, i) => buildArticleSlide(a, i, articles.length))
        .join("");

      loadingScreen.classList.add("hidden");

      // 横スワイプ（内側）を初期化
      document.querySelectorAll(".swiper-horizontal-sub").forEach((el) => {
        new Swiper(el, {
          direction: "horizontal",
          nested: true,
          threshold: 8,
        });
      });

      // 縦スワイプ（外側）を初期化
      verticalSwiperInstance = new Swiper("#vertical-swiper", {
        direction: "vertical",
        threshold: 8,
        on: {
          slideChange(sw) {
            indicator.textContent = `${sw.activeIndex + 1} / ${articles.length}`;
          },
        },
      });

      indicator.textContent = `1 / ${articles.length}`;
    } catch (err) {
      loadingScreen.classList.add("hidden");
      errorScreen.classList.remove("hidden");
      errorMessage.textContent = err.message || "取得に失敗しました";
    }
  }

  loadNews();
</script>
</body>
</html>
