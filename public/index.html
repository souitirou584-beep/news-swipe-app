<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>10秒ニュース | スワイプで読む</title>
<meta name="description" content="左右スワイプで10秒で読めるニュースアプリ" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-border: #29374d;
    --accent: #38bdf8;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --danger: #f87171;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP",
      "Yu Gothic", sans-serif;
    overscroll-behavior: none;
  }

  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }

  /* ---------- Header ---------- */
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(12px + var(--safe-top)) 20px 12px;
    z-index: 20;
  }

  .app-name {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text-primary);
  }
  .app-name span { color: var(--accent); }

  .indicator {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--card-border);
    padding: 4px 10px;
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Swiper ---------- */
  .swiper {
    flex: 1 1 auto;
    width: 100%;
    height: 100%;
  }

  .swiper-slide {
    display: flex;
    align-items: stretch;
    padding: 0 16px calc(16px + var(--safe-bottom));
  }

  .card {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 22px 22px calc(20px + var(--safe-bottom) * 0.4);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }

  .card-top {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .badges {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .badge {
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    letter-spacing: 0.02em;
  }

  .badge-category {
    background: rgba(56, 189, 248, 0.15);
    color: var(--accent);
    border: 1px solid rgba(56, 189, 248, 0.35);
  }

  .badge-date {
    color: var(--text-muted);
    font-weight: 500;
  }

  h1.headline {
    font-size: 22px;
    line-height: 1.35;
    font-weight: 700;
    margin: 0;
    color: var(--text-primary);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  p.summary {
    font-size: 17px;
    line-height: 1.75;
    color: var(--text-secondary);
    margin: 0;
  }

  .card-bottom {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 18px;
  }

  .swipe-hint {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
  }

  a.read-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 48px;
    background: var(--accent);
    color: #06202f;
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
    border-radius: 14px;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  a.read-link:active { transform: scale(0.97); opacity: 0.9; }

  /* ---------- Loading state ---------- */
  .state-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    text-align: center;
    z-index: 10;
  }

  .spinner {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 3px solid var(--card-border);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .state-text { color: var(--text-secondary); font-size: 15px; }

  .state-icon { font-size: 32px; }

  button.retry-btn {
    min-height: 48px;
    padding: 0 24px;
    background: transparent;
    border: 1.5px solid var(--accent);
    color: var(--accent);
    font-weight: 700;
    font-size: 15px;
    border-radius: 14px;
  }
  button.retry-btn:active { transform: scale(0.97); }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="app-name">10Sec<span>News</span></div>
    <div class="indicator" id="indicator">- / -</div>
  </header>

  <div class="swiper" id="swiper-root">
    <div class="swiper-wrapper" id="swiper-wrapper"></div>
  </div>

  <div class="state-screen" id="loading-screen">
    <div class="spinner"></div>
    <div class="state-text">ニュースを読み込み中...</div>
  </div>

  <div class="state-screen hidden" id="error-screen">
    <div class="state-icon">⚠️</div>
    <div class="state-text" id="error-message">ニュースの取得に失敗しました</div>
    <button class="retry-btn" id="retry-btn">再試行する</button>
  </div>

  <div class="state-screen hidden" id="empty-screen">
    <div class="state-icon">📭</div>
    <div class="state-text">表示できる記事がありません</div>
    <button class="retry-btn" id="retry-btn-empty">再読み込み</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
  const API_URL = "/api/news";

  const loadingScreen = document.getElementById("loading-screen");
  const errorScreen = document.getElementById("error-screen");
  const emptyScreen = document.getElementById("empty-screen");
  const errorMessage = document.getElementById("error-message");
  const wrapper = document.getElementById("swiper-wrapper");
  const indicator = document.getElementById("indicator");
  const swiperRoot = document.getElementById("swiper-root");

  let swiperInstance = null;

  function showScreen(screen) {
    [loadingScreen, errorScreen, emptyScreen].forEach((el) => el.classList.add("hidden"));
    swiperRoot.style.visibility = "hidden";
    if (screen) screen.classList.remove("hidden");
  }

  function showApp() {
    [loadingScreen, errorScreen, emptyScreen].forEach((el) => el.classList.add("hidden"));
    swiperRoot.style.visibility = "visible";
  }

  function truncate(text, max) {
    if (!text) return "";
    const clean = text.replace(/\s+/g, " ").trim();
    return clean.length > max ? clean.slice(0, max).trim() + "…" : clean;
  }

  function formatDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    const mm = d.getMonth() + 1;
    const dd = d.getDate();
    const hh = String(d.getHours()).padStart(2, "0");
    const min = String(d.getMinutes()).padStart(2, "0");
    return `${mm}/${dd} ${hh}:${min}`;
  }

  function escapeHtml(str) {
    return (str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function buildSlide(article, index, total) {
    const summary = truncate(article.description, 80);
    return `
      <div class="swiper-slide">
        <div class="card">
          <div class="card-top">
            <div class="badges">
              <span class="badge badge-category">トップニュース</span>
              <span class="badge badge-date">${escapeHtml(formatDate(article.pubDate))}</span>
            </div>
            <h1 class="headline">${escapeHtml(article.title)}</h1>
            <p class="summary">${escapeHtml(summary)}</p>
          </div>
          <div class="card-bottom">
            <a class="read-link" href="${escapeHtml(article.link)}" target="_blank" rel="noopener noreferrer">
              元記事を読む ↗
            </a>
            ${index === 0 ? '<div class="swipe-hint">← スワイプして次のニュースへ →</div>' : ""}
          </div>
        </div>
      </div>
    `;
  }

  function updateIndicator(current, total) {
    indicator.textContent = `${current} / ${total}`;
  }

  async function loadNews() {
    showScreen(loadingScreen);
    if (swiperInstance) {
      swiperInstance.destroy(true, true);
      swiperInstance = null;
    }
    wrapper.innerHTML = "";

    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error(`サーバーエラー (${res.status})`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      const articles = Array.isArray(data.articles) ? data.articles : [];
      if (articles.length === 0) {
        showScreen(emptyScreen);
        return;
      }

      wrapper.innerHTML = articles
        .map((a, i) => buildSlide(a, i, articles.length))
        .join("");

      showApp();

      swiperInstance = new Swiper("#swiper-root", {
        effect: "slide",
        speed: 320,
        threshold: 8,
        on: {
          slideChange(sw) {
            updateIndicator(sw.activeIndex + 1, articles.length);
          },
        },
      });

      updateIndicator(1, articles.length);
    } catch (err) {
      errorMessage.textContent = err.message || "ニュースの取得に失敗しました";
      showScreen(errorScreen);
    }
  }

  document.getElementById("retry-btn").addEventListener("click", loadNews);
  document.getElementById("retry-btn-empty").addEventListener("click", loadNews);

  loadNews();
</script>
</body>
</html>
