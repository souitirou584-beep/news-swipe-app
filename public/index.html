<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>10秒ニュース | スワイプで読む</title>
<meta name="description" content="スペースキーや上下左右スワイプでサクサク読めるニュースアプリ" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@700&family=M+PLUS+Rounded+1c:wght@700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #000000;
    --card: #121212;
    --card-border: #262626;
    --card-inner: #181818;
    --accent: #ffffff;
    --accent-bg: #222222;
    --text-primary: #f5f5f5;
    --text-secondary: #d4d4d4;
    --text-muted: #737373;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text-primary);
    font-family: "Noto Sans JP", -apple-system, BlinkMacSystemFont, sans-serif;
  }

  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }

  /* Header */
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(14px + var(--safe-top)) 24px 12px;
    z-index: 50;
    background: var(--bg);
  }

  .app-name {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: #ffffff;
  }
  .app-name span { color: #888888; }

  .indicator {
    font-size: 13px;
    font-weight: 700;
    color: #e5e5e5;
    background: #1c1c1c;
    border: 1px solid var(--card-border);
    padding: 6px 14px;
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }

  /* Swiper Containers */
  .swiper-vertical-main {
    flex: 1 1 auto;
    width: 100%;
    height: 100%;
  }

  .swiper-horizontal-sub {
    width: 100%;
    height: 100%;
  }

  .swiper-slide {
    display: flex;
    align-items: stretch;
    padding: 0 18px calc(16px + var(--safe-bottom));
  }

  .card {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 24px 22px calc(20px + var(--safe-bottom) * 0.3);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
  }

  .card-top {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
  }

  .badges {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }

  .badge {
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
  }

  .badge-category {
    background: var(--accent-bg);
    color: #ffffff;
    border: 1px solid #333333;
  }

  .badge-page {
    background: #1c1c1c;
    color: var(--text-secondary);
    border: 1px solid var(--card-border);
  }

  .badge-date {
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 500;
    margin-left: auto;
  }

  /* 表紙（1枚目）のタイトル専用スタイル */
  .cover-box {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px 10px;
  }

  h1.cover-title {
    font-family: 'BIZ UDPGothic', 'M PLUS Rounded 1c', sans-serif;
    font-size: 26px;
    line-height: 1.55;
    font-weight: 700;
    margin: 0;
    color: #ffffff;
    letter-spacing: 0.02em;
  }

  /* 本文（2枚目以降）の中央配置コンテナ */
  .summary-container {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 10px 0;
  }

  .summary-box {
    width: 100%;
    background: var(--card-inner);
    border-radius: 18px;
    padding: 24px 20px;
    border: 1px solid #222222;
  }

  .sentence-line {
    font-size: 20px;
    line-height: 1.85;
    color: var(--text-secondary);
    margin: 0 0 16px 0;
    word-break: break-word;
  }
  .sentence-line:last-child {
    margin-bottom: 0;
  }

  /* 画像スライド */
  .image-container {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px 0;
  }

  .image-box {
    width: 100%;
    height: 100%;
    max-height: 320px;
    background: var(--card-inner);
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid #222222;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .image-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .card-bottom {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 14px;
  }

  .nav-hint {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    padding: 0 4px;
  }

  a.read-link {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 50px;
    background: #ffffff;
    color: #000000;
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-weight: 800;
    font-size: 15px;
    text-decoration: none;
    border-radius: 14px;
    transition: opacity 0.1s ease, transform 0.1s ease;
  }
  a.read-link:active {
    opacity: 0.85;
    transform: scale(0.98);
  }

  /* 読み込み中・エラー画面 */
  .state-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    text-align: center;
    background: var(--bg);
    z-index: 60;
  }

  .spinner {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 3px solid #222222;
    border-top-color: #ffffff;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="app-name">10Sec<span>News</span></div>
    <div class="indicator" id="indicator">- / -</div>
  </header>

  <div class="swiper swiper-vertical-main" id="vertical-swiper">
    <div class="swiper-wrapper" id="vertical-wrapper"></div>
  </div>

  <div class="state-screen" id="loading-screen">
    <div class="spinner"></div>
    <div style="color: var(--text-secondary); font-size: 15px; font-weight: 600;">ニュースを取得中...</div>
  </div>

  <div class="state-screen hidden" id="error-screen">
    <div style="font-size: 36px;">⚠️</div>
    <div id="error-message" style="color: var(--text-secondary); font-size: 15px;">取得に失敗しました</div>
    <button onclick="loadNews()" style="padding: 10px 20px; border-radius: 12px; border: 1px solid #444; background: #1a1a1a; color: #fff; font-weight: 700; font-size: 14px;">再試行</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
  const API_URL = "/api/news";
  const TARGET_PAGE_LENGTH = 90;

  const loadingScreen = document.getElementById("loading-screen");
  const errorScreen = document.getElementById("error-screen");
  const errorMessage = document.getElementById("error-message");
  const verticalWrapper = document.getElementById("vertical-wrapper");
  const indicator = document.getElementById("indicator");

  let verticalSwiperInstance = null;
  let horizontalSwiperInstances = [];

  function paginateSentences(text, minTarget) {
    if (!text) return [["（詳細情報は元記事をご確認ください）"]];
    const clean = text.replace(/\s+/g, " ").trim();

    const rawSentences = clean.split(/(?<=。)/g).filter(s => s.trim().length > 0);
    if (rawSentences.length === 0) return [[clean]];

    const pages = [];
    let currentBatch = [];
    let currentLen = 0;

    for (const sentence of rawSentences) {
      currentBatch.push(sentence.trim());
      currentLen += sentence.length;

      if (currentLen >= minTarget) {
        pages.push(currentBatch);
        currentBatch = [];
        currentLen = 0;
      }
    }

    if (currentBatch.length > 0) {
      pages.push(currentBatch);
    }

    return pages;
  }

  function formatDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  }

  function escapeHtml(str) {
    return (str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function buildArticleSlide(article, articleIndex, totalArticles) {
    const textPages = paginateSentences(article.description, TARGET_PAGE_LENGTH);
    const hasImage = Boolean(article.imageUrl);
    const totalPages = 1 + textPages.length + (hasImage ? 1 : 0);

    const subSlides = [];

    // --- 1枚目：表紙（タイトル中央配置） ---
    subSlides.push(`
      <div class="swiper-slide">
        <div class="card">
          <div class="card-top">
            <div class="badges">
              <span class="badge badge-category">TOPIC</span>
              <span class="badge badge-page">1 / ${totalPages}</span>
              <span class="badge-date">${escapeHtml(formatDate(article.pubDate))}</span>
            </div>
            <div class="cover-box">
              <h1 class="cover-title">${escapeHtml(article.title)}</h1>
            </div>
          </div>
          <div class="card-bottom">
            <div class="nav-hint">
              <span>👉 [→ / Space] 本文へ</span>
              <span>👇 [↓] 次の記事</span>
            </div>
            <a class="read-link" href="${escapeHtml(article.link)}" target="_blank" rel="noopener noreferrer">
              元記事を開く ↗
            </a>
          </div>
        </div>
      </div>
    `);

    // --- 2枚目以降：本文テキスト（中央配置） ---
    textPages.forEach((sentenceArray, idx) => {
      const pageNum = idx + 2;
      const sentencesHtml = sentenceArray
        .map(sent => `<p class="sentence-line">${escapeHtml(sent)}</p>`)
        .join("");

      subSlides.push(`
        <div class="swiper-slide">
          <div class="card">
            <div class="card-top">
              <div class="badges">
                <span class="badge badge-category">本文</span>
                <span class="badge badge-page">${pageNum} / ${totalPages}</span>
                <span class="badge-date">${escapeHtml(formatDate(article.pubDate))}</span>
              </div>
              <div class="summary-container">
                <div class="summary-box">
                  ${sentencesHtml}
                </div>
              </div>
            </div>
            <div class="card-bottom">
              <div class="nav-hint">
                <span>${pageNum < totalPages ? "👉 [→ / Space] 続きへ" : "👉 [Space] 次の記事へ"}</span>
                <span>👈 [←] 前へ</span>
              </div>
              <a class="read-link" href="${escapeHtml(article.link)}" target="_blank" rel="noopener noreferrer">
                元記事を開く ↗
              </a>
            </div>
          </div>
        </div>
      `);
    });

    // --- 最終枚：添付画像 ---
    if (hasImage) {
      subSlides.push(`
        <div class="swiper-slide">
          <div class="card">
            <div class="card-top">
              <div class="badges">
                <span class="badge badge-category">写真</span>
                <span class="badge badge-page">${totalPages} / ${totalPages}</span>
                <span class="badge-date">${escapeHtml(formatDate(article.pubDate))}</span>
              </div>
              <div class="image-container">
                <div class="image-box">
                  <img src="${escapeHtml(article.imageUrl)}" alt="記事添付画像" loading="lazy" onerror="this.parentElement.style.display='none';" />
                </div>
              </div>
            </div>
            <div class="card-bottom">
              <div class="nav-hint">
                <span>👉 [Space] 次の記事へ</span>
                <span>👈 [←] 前へ</span>
              </div>
              <a class="read-link" href="${escapeHtml(article.link)}" target="_blank" rel="noopener noreferrer">
                元記事を開く ↗
              </a>
            </div>
          </div>
        </div>
      `);
    }

    return `
      <div class="swiper-slide">
        <div class="swiper swiper-horizontal-sub">
          <div class="swiper-wrapper">
            ${subSlides.join("")}
          </div>
        </div>
      </div>
    `;
  }

  async function loadNews() {
    loadingScreen.classList.remove("hidden");
    errorScreen.classList.add("hidden");

    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error(`Status: ${res.status}`);
      const data = await res.json();
      const articles = data.articles || [];

      if (articles.length === 0) throw new Error("記事がありません");

      verticalWrapper.innerHTML = articles
        .map((a, i) => buildArticleSlide(a, i, articles.length))
        .join("");

      loadingScreen.classList.add("hidden");

      horizontalSwiperInstances = [];
      document.querySelectorAll(".swiper-horizontal-sub").forEach((el) => {
        const hSwiper = new Swiper(el, {
          direction: "horizontal",
          nested: true,
          threshold: 8,
          speed: 280,
        });
        horizontalSwiperInstances.push(hSwiper);
      });

      verticalSwiperInstance = new Swiper("#vertical-swiper", {
        direction: "vertical",
        threshold: 8,
        speed: 300,
        on: {
          slideChange(sw) {
            indicator.textContent = `${sw.activeIndex + 1} / ${articles.length}`;
          },
        },
      });

      indicator.textContent = `1 / ${articles.length}`;
    } catch (err) {
      loadingScreen.classList.add("hidden");
      errorScreen.classList.remove("hidden");
      errorMessage.textContent = err.message || "取得に失敗しました";
    }
  }

  window.addEventListener("keydown", (e) => {
    if (!verticalSwiperInstance) return;

    const currentVerticalIndex = verticalSwiperInstance.activeIndex;
    const currentHorizontalSwiper = horizontalSwiperInstances[currentVerticalIndex];

    if (e.code === "Space") {
      e.preventDefault();
      if (currentHorizontalSwiper) {
        if (!currentHorizontalSwiper.isEnd) {
          currentHorizontalSwiper.slideNext();
        } else {
          verticalSwiperInstance.slideNext();
        }
      } else {
        verticalSwiperInstance.slideNext();
      }
      return;
    }

    switch (e.code) {
      case "ArrowDown":
        verticalSwiperInstance.slideNext();
        e.preventDefault();
        break;
      case "ArrowUp":
        verticalSwiperInstance.slidePrev();
        e.preventDefault();
        break;
      case "ArrowRight":
        if (currentHorizontalSwiper) {
          currentHorizontalSwiper.slideNext();
        }
        e.preventDefault();
        break;
      case "ArrowLeft":
        if (currentHorizontalSwiper) {
          currentHorizontalSwiper.slidePrev();
        }
        e.preventDefault();
        break;
    }
  });

  loadNews();
</script>
</body>
</html>
